services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wms}
      POSTGRES_USER: ${POSTGRES_USER:-wms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wms} -d ${POSTGRES_DB:-wms}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn wms.api.app:app --host 0.0.0.0 --port 8000"
    environment:
      WMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wms}
      WMS_SECRET_KEY: ${WMS_SECRET_KEY:?set WMS_SECRET_KEY in .env}
      WMS_MESSAGE_TTL_HOURS: ${WMS_MESSAGE_TTL_HOURS:-24}
      WMS_OIDC_ISSUER: ${WMS_OIDC_ISSUER:-}
      WMS_OIDC_CLIENT_ID: ${WMS_OIDC_CLIENT_ID:-}
      WMS_OIDC_CLIENT_SECRET: ${WMS_OIDC_CLIENT_SECRET:-}
      WMS_OIDC_REDIRECT_URI: ${WMS_OIDC_REDIRECT_URI:-}
      WMS_OIDC_NAME: ${WMS_OIDC_NAME:-}
      WMS_OIDC_CREATE_USERS: ${WMS_OIDC_CREATE_USERS:-false}
      WMS_OIDC_DEFAULT_ROLE: ${WMS_OIDC_DEFAULT_ROLE:-picker}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Caddy is the only door in a real install. Set WMS_API_PORT to publish it
    # on the host as well, which is what CI and local API work do.
    ports:
      - "127.0.0.1:${WMS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ./api
    restart: unless-stopped
    command: python -m wms.worker
    environment:
      WMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wms}
      WMS_SECRET_KEY: ${WMS_SECRET_KEY}
      WMS_MESSAGE_TTL_HOURS: ${WMS_MESSAGE_TTL_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      WMS_DOMAIN: ${WMS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/desktop/dist:/srv/desktop:ro
      - ./apps/scanner/dist:/srv/scanner:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Nightly dump of the database. Not started by `up`; run it from cron:
  #   0 2 * * *  cd /srv/simple-wms && docker compose run --rm backup
  # Or once, by hand, to check it works: docker compose run --rm backup
  backup:
    image: postgres:16
    profiles: ["backup"]
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-wms}
      POSTGRES_USER: ${POSTGRES_USER:-wms}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
