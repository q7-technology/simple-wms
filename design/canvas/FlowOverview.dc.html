<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Process flow - Overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0d1117;font-family:ui-sans-serif, system-ui, sans-serif;color:#ccd6f6}
a{color:#29abe2}a:hover{color:#64ffda}
</style>
</helmet>
<div style="width: 1600px; height: 760px; box-sizing: border-box; background: #0d1117; color: #ccd6f6; font-family: ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column;">
<div style="box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; flex-grow: 1;">
  <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #29abe2;">Overview</span><h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 700;"><span style="color: #29abe2;">How stock moves</span> through the WMS</h1><span style="font-size: 16px; line-height: 24px; color: #8892b0;">Everything is a task. Every task ends in a ledger line. Every ledger line can become an event.</span></div>
  <svg role="img" aria-label="Overview of stock flow" width="1536" height="520" viewBox="0 0 1536 520" style="display: block;">
    <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29abe2"/></marker></defs>
    <rect x="0" y="0" width="1536" height="90" rx="8" fill="rgba(41,171,226,0.04)" stroke="rgba(41,171,226,0.15)"/>
    <text x="20" y="30" fill="#8892b0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.05em">OUTSIDE · API IN</text>

      <rect x="120" y="40" width="200" height="40" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-dasharray="6 4"/><text x="220" y="65" fill="#ccd6f6">ERP: deliveries, receipts</text>
      <rect x="420" y="40" width="200" height="40" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-dasharray="6 4"/><text x="520" y="65" fill="#ccd6f6">Production orders</text>
      <rect x="720" y="40" width="200" height="40" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-dasharray="6 4"/><text x="820" y="65" fill="#ccd6f6">Transfers, replenishments</text>
      <rect x="1020" y="40" width="200" height="40" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-dasharray="6 4"/><text x="1120" y="65" fill="#ccd6f6">Web store, CSV import</text>
    </g>
    <line x1="220" y1="80" x2="220" y2="150" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="520" y1="80" x2="520" y2="150" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="820" y1="80" x2="820" y2="150" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="1120" y1="80" x2="1120" y2="150" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="0" y="150" width="1536" height="230" rx="8" fill="transparent" stroke="rgba(41,171,226,0.15)"/>
    <text x="20" y="180" fill="#8892b0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.05em">INSIDE THE WMS · TASKS → LEDGER</text>

      <rect x="60" y="205" width="150" height="62" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-width="1.5"/><text x="135" y="240" fill="#ccd6f6">Receive</text>

      <rect x="420" y="205" width="150" height="62" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-width="1.5"/><text x="495" y="240" fill="#ccd6f6">Replenish</text>
      <rect x="600" y="205" width="150" height="62" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-width="1.5"/><text x="675" y="240" fill="#ccd6f6">Pick</text>
      <rect x="780" y="205" width="150" height="62" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-width="1.5"/><text x="855" y="240" fill="#ccd6f6">Pack</text>
      <rect x="960" y="205" width="150" height="62" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-width="1.5"/><text x="1035" y="240" fill="#ccd6f6">Ship</text>
      <rect x="1140" y="205" width="150" height="62" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-width="1.5"/><text x="1215" y="240" fill="#ccd6f6">Transfer</text>
      <rect x="1320" y="205" width="150" height="62" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-width="1.5"/><text x="1395" y="240" fill="#ccd6f6">Count / move</text>
    </g>
    <line x1="210" y1="236" x2="240" y2="236" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="390" y1="236" x2="420" y2="236" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="570" y1="236" x2="600" y2="236" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="750" y1="236" x2="780" y2="236" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="930" y1="236" x2="960" y2="236" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="60" y="300" width="1410" height="56" rx="28" fill="rgba(41,171,226,0.1)" stroke="#29abe2" stroke-width="1.5"/>
    <text x="765" y="326" text-anchor="middle" fill="#ccd6f6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Append-only stock ledger</text>
    <text x="765" y="345" text-anchor="middle" fill="#8892b0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">who · what · how many · from · to · batch · owner · device · when — nothing overwritten, cancel instead of delete</text>
    <g stroke="#29abe2" stroke-width="1.5"><line x1="135" y1="267" x2="135" y2="300" marker-end="url(#a)"/><line x1="315" y1="267" x2="315" y2="300" marker-end="url(#a)"/><line x1="495" y1="267" x2="495" y2="300" marker-end="url(#a)"/><line x1="675" y1="267" x2="675" y2="300" marker-end="url(#a)"/><line x1="855" y1="267" x2="855" y2="300" marker-end="url(#a)"/><line x1="1035" y1="267" x2="1035" y2="300" marker-end="url(#a)"/><line x1="1215" y1="267" x2="1215" y2="300" marker-end="url(#a)"/><line x1="1395" y1="267" x2="1395" y2="300" marker-end="url(#a)"/></g>
    <line x1="765" y1="356" x2="765" y2="430" stroke="#29abe2" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="0" y="430" width="1536" height="90" rx="8" fill="rgba(41,171,226,0.04)" stroke="rgba(41,171,226,0.15)"/>
    <text x="20" y="460" fill="#8892b0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.05em">OUTSIDE · EVENTS OUT (one envelope, durable queue, HMAC signed)</text>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">
      <rect x="120" y="470" width="200" height="40" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-dasharray="6 4"/><text x="220" y="495" fill="#ccd6f6">ERP: goods issue / receipt</text>
      <rect x="420" y="470" width="200" height="40" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-dasharray="6 4"/><text x="520" y="495" fill="#ccd6f6">Carriers: tracking</text>
      <rect x="720" y="470" width="200" height="40" rx="8" fill="#0d1117" stroke="rgba(41,171,226,0.3)" stroke-dasharray="6 4"/><text x="820" y="495" fill="#ccd6f6">EDI broker: ASN</text>
      <rect x="1020" y="470" width="200" height="40" rx="8" fill="#0d1117" stroke="#f7941d" stroke-dasharray="6 4"/><text x="1120" y="495" fill="#f7941d">Platen: labels and pages</text>
    </g>
  </svg>
  <div style="display: flex; gap: 24px; font-size: 14px; line-height: 20px; color: #8892b0;"><span><b style="color: #ccd6f6;">Desktop</b> creates, watches, approves.</span><span><b style="color: #ccd6f6;">Scanner</b> does the work and confirms it.</span><span><b style="color: #ccd6f6;">API</b> is the only way in and out for other systems.</span></div>
</div>
</div>
