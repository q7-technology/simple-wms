<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Scanner - Pick task</title>
<style>
body{margin:0;background:#0d1117;font-family:ui-sans-serif,system-ui,sans-serif;color:#ccd6f6}
a{color:#29abe2}a:hover{color:#64ffda}
html,body{min-height:100%}
body{display:flex;justify-content:center;padding:24px 0}
a{cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0d1117; color: #ccd6f6; font-family: ui-sans-serif, system-ui, sans-serif;">

  <header style="box-sizing: border-box; padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(41,171,226,0.2);">
    <a href="ScannerMenu.html" aria-label="Back to menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid rgba(41,171,226,0.2); text-decoration: none;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ccd6f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #29abe2;">Pick · single</span>
      <span style="font-size: 16px; line-height: 24px; font-weight: 600;">0080012345</span>
    </div>
    <span style="font-size: 12px; line-height: 16px; color: #8892b0;">Sam · BAL</span>
  </header>

  <div style="box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(41,171,226,0.1);">
    <span style="font-size: 14px; line-height: 20px; color: #8892b0;">Line 3 of 4</span>
    <div style="flex-grow: 1; height: 6px; border-radius: 9999px; background: rgba(41,171,226,0.2); overflow: hidden;">
      <div style="width: 50%; height: 100%; background: #29abe2;"></div>
    </div>
  </div>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px;">

    <section aria-label="Go to location" style="box-sizing: border-box; padding: 20px; border-radius: 12px; border: 1px solid rgba(41,171,226,0.3); background: rgba(13,17,23,0.6); display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #8892b0;">Go to</span>
      <span style="font-size: 48px; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em;">PF-01-02-A</span>
      <span style="font-size: 14px; line-height: 20px; color: #8892b0;">Pick face · aisle 1, bay 2, level A</span>
    </section>

    <section aria-label="Product" style="box-sizing: border-box; padding: 20px; border-radius: 12px; border: 1px solid rgba(41,171,226,0.2); background: rgba(13,17,23,0.6); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 20px; line-height: 28px; font-weight: 700;">GHI789</span>
          <span style="font-size: 14px; line-height: 20px; color: #8892b0;">Wiper blade 22"</span>
        </div>
        <span style="padding: 2px 8px; border-radius: 9999px; font-size: 12px; font-weight: 600; border: 1px solid rgba(41,171,226,0.2); color: #8892b0; white-space: nowrap;">FIFO · batch B2609A</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-size: 36px; line-height: 40px; font-weight: 700;">6</span>
        <span style="font-size: 16px; line-height: 24px; color: #8892b0;">EA to pick · 38 available here</span>
      </div>
    </section>

    <section aria-label="Scan" style="box-sizing: border-box; padding: 16px; border-radius: 12px; border: 1px dashed rgba(41,171,226,0.3); display: flex; align-items: center; gap: 12px;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#29abe2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 7v10"/><path d="M12 7v10"/><path d="M17 7v10"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; line-height: 20px; font-weight: 500;">Scan the location, then the product</span>
        <span style="font-size: 12px; line-height: 16px; color: #8892b0;">One GS1 code fills product, batch and quantity</span>
      </div>
    </section>

    <div style="flex-grow: 1;"></div>

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; line-height: 16px; color: #8892b0;">Quantity picked</span>
      <div style="display: flex; gap: 8px;">
        <button type="button" aria-label="Less" style="width: 56px; height: 56px; border-radius: 6px; background: transparent; border: 1px solid rgba(41,171,226,0.3); color: #ccd6f6; font-size: 24px; cursor: pointer;">−</button>
        <input type="number" value="6" style="flex-grow: 1; height: 56px; box-sizing: border-box; text-align: center; font-size: 28px; font-weight: 700; border-radius: 6px; background: #0d1117; border: 1px solid rgba(41,171,226,0.3); color: #ccd6f6;">
        <button type="button" aria-label="More" style="width: 56px; height: 56px; border-radius: 6px; background: transparent; border: 1px solid rgba(41,171,226,0.3); color: #ccd6f6; font-size: 24px; cursor: pointer;">+</button>
      </div>
    </label>
  </main>

  <footer style="box-sizing: border-box; padding: 16px; display: flex; gap: 8px; border-top: 1px solid rgba(41,171,226,0.2);">
    <button type="button" style="flex-grow: 1; height: 56px; border-radius: 6px; background: transparent; border: 1px solid #f7941d; color: #f7941d; font-size: 16px; font-weight: 500; cursor: pointer;">Short pick</button>
    <button type="button" style="flex-grow: 2; height: 56px; border-radius: 6px; background: #29abe2; border: 1px solid #29abe2; color: #0d1117; font-size: 16px; font-weight: 600; cursor: pointer;">Confirm pick</button>
  </footer>
</div>
</body>
</html>
