<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0d1117; color: #ccd6f6; font-family: ui-sans-serif, system-ui, sans-serif;">

      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;"><div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 20px; line-height: 28px; font-weight: 700;">ABC123</span><span style="font-size: 14px; line-height: 20px; font-weight: 400; color: #8892b0;">Brake pad set</span></div><span style="display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; border: 1px solid rgba(41,171,226,0.2); color: #8892b0;">Shipped 200 · batch B2601</span></div>
      <div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 36px; line-height: 40px; font-weight: 700;">200</span><span style="font-size: 16px; line-height: 24px; color: #8892b0;">EA shipped · received date kept for FIFO</span></div></section>
