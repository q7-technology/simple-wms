<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple WMS manager sign-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FD}
a{color:#2557C9}a:hover{color:#1A3F99}
</style>

</head>
<body>

<div style="min-height: 100vh; font-family: Manrope, system-ui, sans-serif; color: #18233D; background: #E6EDFB; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;">

  <div aria-hidden="true" style="position: absolute; inset: 0;">
    <img src="warehouse.svg" alt="" style="display: block; width: 100%; max-width: 1540px; height: auto; margin: 0 auto; opacity: .55;">
    <div style="position: absolute; inset: 0; background: rgba(230,237,251,.45);"></div>
  </div>

  <main style="position: relative; width: 100%; max-width: 440px; padding: 36px 32px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 24px 60px rgba(24,35,61,.18); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; box-sizing: border-box;">
    <svg width="64" height="64" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 28 10 16 17 4 10Z" fill="#6E95F0"></path><path d="M4 10 16 17V30L4 23Z" fill="#3E6FE2"></path><path d="M28 10 16 17V30L28 23Z" fill="#2B57C2"></path></svg>
    <div>
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.4px;">Simple WMS</h1>
      <p style="margin: 6px 0 0; font-size: 15px; color: #4A5672;">Your warehouse is waiting. Sign in to start the day.</p>
    </div>

    <a href="Main.html" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 14px; background: #18233D; color: #FFFFFF; font-weight: 800; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px;">
      <span style="width: 26px; height: 26px; border-radius: 6px; background: #FFFFFF; color: #18233D; display: grid; place-items: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5l8-2 8 2v16"></path><path d="M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"></path></svg>
      </span>Sign in with Microsoft</a>

    <div style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 14px; background: #EEF3FF; text-align: left; box-sizing: border-box;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2148A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6Z"></path><path d="m9 12 2 2 4-4"></path></svg>
      <span style="font-size: 13px; color: #2B3A5E;">Uses your work Microsoft account. No new password to remember.</span>
    </div>

    <p style="margin: 0; font-size: 13px; color: #5A6785;">Can't get in? Ask whoever runs IT at your work to add you to Simple WMS.</p>
  </main>

  <p style="position: absolute; bottom: 16px; left: 0; right: 0; margin: 0; text-align: center; font-size: 12px; color: #3A4A72;">Simple WMS · open source</p>
</div>
</body>
</html>
