<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Simple WMS scanner count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2557C9}a:hover{color:#1A3F99}
</style>
<style>html,body{min-height:100%}body{display:flex;justify-content:center;padding:24px 0;background:#E6EDFB !important}</style>
</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Manrope, system-ui, sans-serif; color: #18233D; background: #F3F6FD; display: flex; flex-direction: column;">

  <div style="flex: none; padding: 16px 16px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #DDE5F5; background: #FFFFFF;">
    <a href="ScannerHome.html" aria-label="Back to menu" style="width: 44px; height: 44px; flex: none; border-radius: 14px; border: 1px solid #CFDAF2; background: #FFFFFF; color: #18233D; display: grid; place-items: center; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0;">
      <div style="font-size: 18px; font-weight: 800;">Shelf count</div>
      <div style="font-size: 12px; color: #4A5672;">CNT-0412 · PICKFACE aisle 1 · Sam · BAL-WH01</div>
    </div>
    <span style="padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE5F5; font-size: 12px; font-weight: 800; color: #4A5672; white-space: nowrap;">Scanner 3</span>
  </div>

  <div style="flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">

    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 13px; font-weight: 800; color: #4A5672; white-space: nowrap;">Shelf 4 of 12</span>
      <div role="progressbar" aria-label="Shelves counted" aria-valuemin="0" aria-valuemax="12" aria-valuenow="3" style="flex: 1; height: 10px; border-radius: 999px; background: #E6EDFB; overflow: hidden;"><div style="width: 25%; height: 100%; border-radius: 999px; background: #2F6FE4;"></div></div>
    </div>

    

    
      <section aria-label="Shelf to count" style="padding: 12px 16px; border-radius: 18px; background: #FFFFFF; border: 2px solid #2F6FE4; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 13px; font-weight: 800; color: #4A5672;">Count this shelf</span>
          <span style="display: flex; gap: 6px; align-items: center;">
            <span style="padding: 3px 9px; border-radius: 999px; background: #D3EFE8; color: #0F5F59; font-size: 12px; font-weight: 800;">Stored</span>
            <span style="font-size: 12px; font-weight: 700; color: #5A6785;">PICKFACE</span>
          </span>
        </div>
        <div style="font-size: 32px; font-weight: 800; letter-spacing: -0.5px;">PF-01-02-A</div>
        <div style="font-size: 12px; color: #5A6785; display: flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 6.1A10 10 0 0 1 22 12a17 17 0 0 1-3 3.6M6.6 6.6A17 17 0 0 0 2 12a10 10 0 0 0 13.4 5.4"></path></svg>Blind count: we hide how many should be here. Count what you see.
        </div>
      </section>

      <button type="button" style="height: 66px; flex: none; border: 2px dashed #2F6FE4; border-radius: 16px; background: #FFFFFF; color: #18233D; font: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;">
        
        
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2F6FE4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg>
        
        <span style="text-align: left;"><span style="display: block; font-size: 17px; font-weight: 800;">Scan the shelf</span><span style="display: block; font-size: 12px; color: #4A5672;">Tap to pretend-scan.</span></span>
      </button>

      <section aria-label="Product on shelf" style="padding: 12px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #DDE5F5; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
          <div>
            <div style="font-size: 18px; font-weight: 800;">ABC123</div>
            <div style="font-size: 14px; color: #4A5672;">Brake pad set</div>
          </div>
          <span style="padding: 4px 10px; border-radius: 999px; background: #EEF3FF; color: #2148A8; font-size: 12px; font-weight: 800; white-space: nowrap;">Batch B2601</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-size: 34px; font-weight: 800;">46</span>
          <span style="font-size: 15px; color: #4A5672;">EA counted</span>
        </div>
        <label for="qty" style="font-size: 14px; font-weight: 800;">How many are on the shelf?</label>
        <div style="display: flex; gap: 8px;">
          <button type="button" aria-label="One less" style="width: 56px; height: 56px; flex: none; border-radius: 16px; border: 1px solid #CFDAF2; background: #FFFFFF; color: #18233D; cursor: pointer; display: grid; place-items: center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
          </button>
          <input id="qty" type="number" inputmode="numeric" value="46" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; text-align: center; font: inherit; font-size: 28px; font-weight: 800; color: #18233D; border-radius: 16px; background: #FFFFFF; border: 2px solid #CFDAF2;">
          <button type="button" aria-label="One more" style="width: 56px; height: 56px; flex: none; border-radius: 16px; border: 1px solid #CFDAF2; background: #FFFFFF; color: #18233D; cursor: pointer; display: grid; place-items: center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
          </button>
        </div>
      </section>

      

      
    
  </div>

  <div style="flex: none; padding: 12px 16px 18px; border-top: 1px solid #DDE5F5; background: #FFFFFF;">
    
    
      <div style="display: flex; gap: 10px;">
        <button type="button" style="flex: 1; height: 58px; border: 2px solid #18233D; border-radius: 16px; background: #FFFFFF; color: #18233D; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer;">Count again</button>
        <button type="button" style="flex: 2; height: 58px; border: 0; border-radius: 16px; background: #2F6FE4; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 18px; cursor: pointer;">Send count</button>
      </div>
    
  </div>

  
</div>
</body>
</html>
