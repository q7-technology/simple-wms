<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple WMS task board panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FD}
a{color:#2557C9}a:hover{color:#1A3F99}
@media (max-width: 960px){
.drawer{position:static !important;width:auto !important;border-radius:0 !important}
.dim{display:none !important}
}
</style>
</helmet>
<div style="min-height: 100vh; font-family: Manrope, system-ui, sans-serif; color: #18233D; background: #F3F6FD; position: relative; overflow: hidden;">

  <div class="dim" aria-hidden="true" style="position: absolute; inset: 0;">
    <img src="/_blob/da4428b0458976bb60e501687b333de2" alt="" style="display: block; width: 100%; max-width: 1540px; height: auto; margin: 0 auto; filter: blur(2px);">
    <div style="position: absolute; inset: 0; background: rgba(24,35,61,.38);"></div>
  </div>

  <section class="drawer" aria-label="Task board" style="position: absolute; top: 0; right: 0; bottom: 0; width: 72%; min-width: 0; background: #FFFFFF; border-radius: 24px 0 0 24px; box-shadow: -20px 0 50px rgba(24,35,61,.25); display: flex; flex-direction: column;">

    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 22px 28px 14px;">
      <a href="Main.dc.html" aria-label="Back to the map" style="width: 44px; height: 44px; border-radius: 12px; background: #F3F6FD; color: #18233D; display: grid; place-items: center; text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </a>
      <div style="flex: 1; min-width: 220px;">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #145A31;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #22A05A;" aria-hidden="true"></span>BALLARAT · LIVE</div>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.3px;">Task board</h1>
        <div style="font-size: 13px; color: #5A6785;">Every job in the shed, from waiting to done. Tap a card to hand it out.</div>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #5A6785;">Warehouse
        <select style="height: 44px; padding: 0 10px; border: 1px solid #CFDAF2; border-radius: 12px; font: inherit; font-size: 14px; color: #18233D; background: #FFFFFF;">
          <option>BAL-WH01 · Ballarat</option>
          <option>MEL-WH01 · Melbourne</option>
        </select>
      </label>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #4A5672;"><span style="width: 32px; height: 32px; border-radius: 999px; background: #EEF3FF; color: #2148A8; display: grid; place-items: center; font-size: 12px; font-weight: 800;">LL</span>Supervisor</span>
    </header>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 28px 14px; border-bottom: 1px solid #E6EDFB;">
      <div role="tablist" aria-label="Task type" style="display: flex; flex-wrap: wrap; gap: 6px;">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
          <button type="button" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
      <span style="flex: 1;"></span>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: #E3F5EA; color: #145A31; font-size: 12px; font-weight: 800;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>4 operators on floor
      </span>
      <button type="button" onClick="{{openAssign}}" disabled="{{noPick}}" style="{{assignStyle}}">Assign</button>
      <button type="button" onClick="{{openCreate}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #2F6FE4; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Create task
      </button>
    </div>

    <sc-if value="{{createOn}}" hint-placeholder-val="{{ false }}">
      <div role="group" aria-label="Create task" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin: 14px 28px 0; padding: 14px; border-radius: 16px; background: #EEF3FF;">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Type
          <select onChange="{{setNewType}}" style="height: 44px; padding: 0 10px; border: 1px solid #CFDAF2; border-radius: 12px; font: inherit; font-size: 14px; color: #18233D; background: #FFFFFF;">
            <option value="Count">Count</option>
            <option value="Move">Move</option>
            <option value="Replenish">Replenish</option>
          </select>
        </label>
        <label style="flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">What and where
          <input type="text" value="{{newWhat}}" onInput="{{setNewWhat}}" placeholder="e.g. PF-01-09 to PF-01-12" style="height: 44px; padding: 0 12px; border: 1px solid #CFDAF2; border-radius: 12px; font: inherit; font-size: 14px; color: #18233D;">
        </label>
        <button type="button" onClick="{{closeCreate}}" style="height: 44px; padding: 0 14px; border: 1px solid #CFDAF2; border-radius: 12px; background: #FFFFFF; color: #18233D; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;">Never mind</button>
        <button type="button" onClick="{{addTask}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #2F6FE4; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer;">Add to Waiting</button>
      </div>
    </sc-if>

    <sc-if value="{{assignOn}}" hint-placeholder-val="{{ false }}">
      <div role="group" aria-label="Assign task" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 28px 0; padding: 12px 14px; border-radius: 16px; background: #18233D; color: #FFFFFF;">
        <span style="flex: 1; min-width: 180px; font-weight: 800; font-size: 14px;">Give “{{pickedTitle}}” to</span>
        <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
          <button type="button" onClick="{{p.give}}" style="height: 44px; padding: 0 14px; border: 1px solid #44507A; border-radius: 12px; background: transparent; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;">{{p.name}}</button>
        </sc-for>
        <button type="button" onClick="{{closeAssign}}" aria-label="Close assign" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #2A3655; color: #FFFFFF; cursor: pointer; display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </sc-if>

    <div style="flex: 1; overflow: auto; padding: 16px 28px 40px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; align-items: start;">
        <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
          <section aria-label="{{c.title}}" style="{{c.style}}">
            <h2 style="margin: 0 0 4px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: 1px;"><span style="{{c.dot}}" aria-hidden="true"></span>{{c.title}} <span style="{{c.countStyle}}">{{c.count}}</span></h2>
            <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="4">
              <div style="{{k.style}}">
                <button type="button" onClick="{{k.select}}" aria-pressed="{{k.on}}" style="display: block; width: 100%; min-height: 44px; padding: 0; border: 0; background: transparent; text-align: left; font: inherit; color: inherit; cursor: pointer;">
                  <span style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;"><span style="{{k.typeChip}}">{{k.type}}</span><sc-if value="{{k.flag}}" hint-placeholder-val="{{ false }}"><span style="{{k.flagChip}}">{{k.flagText}}</span></sc-if></span>
                  <span style="display: block; font-size: 14px; font-weight: 800;">{{k.title}}</span>
                  <span style="display: block; font-size: 12px; color: #4A5672; margin-top: 2px;">{{k.sub}}</span>
                </button>
                <sc-if value="{{k.hasBar}}" hint-placeholder-val="{{ false }}">
                  <div style="height: 6px; margin-top: 8px; border-radius: 999px; background: #E6EDFB; overflow: hidden;" aria-hidden="true"><div style="{{k.bar}}"></div></div>
                </sc-if>
                <sc-if value="{{k.decide}}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; gap: 6px; margin-top: 10px;">
                    <button type="button" onClick="{{k.approve}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #2F6FE4; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer;">{{k.yesLabel}}</button>
                    <button type="button" onClick="{{k.recount}}" style="flex: 1; height: 44px; border: 1px solid #CFDAF2; border-radius: 10px; background: #FFFFFF; color: #18233D; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer;">Recount</button>
                  </div>
                </sc-if>
              </div>
            </sc-for>
            <sc-if value="{{c.hasMore}}" hint-placeholder-val="{{ true }}">
              <div style="font-size: 12px; font-weight: 700; color: #5A6785; padding: 2px 4px;">{{c.more}}</div>
            </sc-if>
          </section>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="position: absolute; top: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; background: #18233D; color: #FFFFFF; font-weight: 800; font-size: 14px; box-shadow: 0 10px 30px rgba(24,35,61,.25); white-space: nowrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7CDB9E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>{{toast}}
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      filter: 'all', picked: '', toast: '', assign: false, create: false, newType: 'Count', newWhat: '', seq: 414,
      extra: { waiting: 4, done: 27 },
      tasks: [
        { id: 'w1', col: 'waiting', type: 'Pick', title: 'Pick 0080012347', sub: 'Wendouree Motor Spares · 2 lines · due 11:00' },
        { id: 'w2', col: 'waiting', type: 'Pick', title: 'Pick 0080012348 · batch B-15', sub: '3 orders · 14 lines · due 11:30' },
        { id: 'w3', col: 'waiting', type: 'Replenish', title: 'Replenish REP-1003', sub: 'JKL012 · 60 EA → PF-01-06-A' },
        { id: 'w4', col: 'waiting', type: 'Count', title: 'Count CNT-0413', sub: 'PF-01-03 to PF-01-08' },
        { id: 'w5', col: 'waiting', type: 'Receive', title: 'Receive PO-88816', sub: 'Miners Rest Brake Supply · truck at dock 2', warn: 'Truck waiting' },
        { id: 'p1', col: 'doing', type: 'Pick', title: 'Pick 0080012345', sub: 'Sam · line 3 of 4 · 29 min', pct: 75 },
        { id: 'p2', col: 'doing', type: 'Pick', title: 'Pick 0080012346 · batch B-14', sub: 'Priya · 8 of 12 lines · 41 min', pct: 67 },
        { id: 'p3', col: 'doing', type: 'Receive', title: 'Receive PO-88815', sub: 'Jo · line 2 of 5 · 1 h 10 min', pct: 40, warn: 'Running long' },
        { id: 'p4', col: 'doing', type: 'Replenish', title: 'Replenish REP-1001', sub: 'Jo · queued behind receipt', pct: 0 },
        { id: 'p5', col: 'doing', type: 'Production', title: 'Production receipt PRD-1000456', sub: 'Sam · 240 of 500 · pallet 3', pct: 48 },
        { id: 'p6', col: 'doing', type: 'Production', title: 'Issue PRD-1000457', sub: 'Priya · 1 of 3 components', pct: 33 },
        { id: 's1', col: 'super', type: 'Pick', title: 'Short pick · 0080012345 line 30', sub: '4 EA GHI789 not found · approve or recount', warn: 'Short', yes: 'Approve short' },
        { id: 's2', col: 'super', type: 'Production', title: 'Over tolerance · PRD-1000452', sub: '+12 EA above order · accept?', warn: 'Over', yes: 'Accept' },
        { id: 's3', col: 'super', type: 'Count', title: 'Variance · CNT-0412', sub: '−2 EA at PF-01-02-A', warn: 'Variance', yes: 'Accept count' },
        { id: 'd1', col: 'done', type: 'Pick', title: 'Pick 0080012340', sub: 'Sam · shipped 08:52 · short 1' },
        { id: 'd2', col: 'done', type: 'Pick', title: 'Pick 0080012338', sub: 'Jo · packed 08:40' },
        { id: 'd3', col: 'done', type: 'Pick', title: 'Pick 0080012336', sub: 'Jo · shipped 08:10' },
        { id: 'd4', col: 'done', type: 'Replenish', title: 'Replenish REP-0998', sub: 'Jo · 07:50' }
      ]
    };
  }
  renderVals() {
    var s = this.state, self = this;
    var chip = function (bg, ink) { return 'display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; background: ' + bg + '; color: ' + ink + ';'; };
    var TYPE = {
      Receive: ['#D8E5FF', '#1F4FB0'], Replenish: ['#D3EFE8', '#0F5F59'], Count: ['#D3EFE8', '#0F5F59'], Move: ['#D3EFE8', '#0F5F59'],
      Pick: ['#FDE6D2', '#8E4A0E'], Production: ['#E6EDFB', '#2148A8']
    };
    var COLS = [
      ['waiting', 'WAITING', '#2F6FE4', 'waiting'],
      ['doing', 'IN PROGRESS', '#E08A2E', null],
      ['super', 'NEEDS A SUPERVISOR', '#C9372C', null],
      ['done', 'DONE TODAY', '#22A05A', 'done']
    ];
    var flash = function (msg) {
      self.setState({ toast: msg });
      clearTimeout(self._t);
      self._t = setTimeout(function () { self.setState({ toast: '' }); }, 2200);
    };
    var upd = function (id, patch) {
      return s.tasks.map(function (t) { return t.id === id ? Object.assign({}, t, patch) : t; });
    };
    var fDefs = [['all', 'All'], ['Pick', 'Pick'], ['Receive', 'Receive'], ['Replenish', 'Replenish'], ['Count', 'Count'], ['Production', 'Production']];
    var filters = fDefs.map(function (f) {
      var on = s.filter === f[0];
      return {
        label: f[1], on: on, pick: function () { self.setState({ filter: f[0] }); },
        style: 'height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; border: 1px solid ' + (on ? '#2F6FE4' : '#DDE5F5') + '; background: ' + (on ? '#2F6FE4' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#18233D') + ';'
      };
    });
    var pickedTask = s.tasks.filter(function (t) { return t.id === s.picked; })[0];
    var cols = COLS.map(function (c) {
      var all = s.tasks.filter(function (t) { return t.col === c[0]; });
      var shown = all.filter(function (t) { return s.filter === 'all' || t.type === s.filter; });
      var extra = c[3] ? s.extra[c[3]] : 0;
      var cards = shown.map(function (t) {
        var on = s.picked === t.id, ty = TYPE[t.type], isSuper = t.col === 'super';
        return {
          type: t.type, title: t.title, sub: t.sub, on: on,
          typeChip: chip(ty[0], ty[1]),
          flag: !!t.warn || t.col === 'done', flagText: t.col === 'done' ? 'Done' : t.warn,
          flagChip: t.col === 'done' ? chip('#E3F5EA', '#145A31') : (isSuper ? chip('#FDE2E0', '#A3221A') : chip('#FFF0C2', '#7A5C00')),
          hasBar: t.col === 'doing', bar: 'height: 100%; border-radius: 999px; background: #2F6FE4; width: ' + (t.pct || 0) + '%;',
          decide: isSuper, yesLabel: t.yes || 'Approve',
          style: 'padding: 12px; border-radius: 14px; background: #FFFFFF; border: ' + (on ? '2px solid #2F6FE4' : (t.warn ? '1px solid #F2C9A5' : '1px solid #E6EDFB')) + '; box-shadow: ' + (on ? '0 6px 16px rgba(47,111,228,.18)' : 'none') + ';',
          select: function () { self.setState({ picked: on ? '' : t.id, assign: false }); },
          approve: function () {
            self.setState({ tasks: upd(t.id, { col: 'done', sub: 'Approved by you · just now', warn: '' }), picked: '' });
            flash('Ding! ' + t.title.split(' · ')[0] + ' sorted');
          },
          recount: function () {
            self.setState({ tasks: upd(t.id, { col: 'waiting', type: 'Count', title: 'Recount · ' + t.title.split(' · ')[1], sub: 'Sent back for a recount', warn: '' }), picked: '' });
            flash('Recount added to Waiting');
          }
        };
      });
      return {
        title: c[1], count: all.length + extra, cards: cards,
        hasMore: extra > 0, more: '+' + extra + ' more',
        style: 'display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 18px; background: #F7F9FE; border: 1px solid #E6EDFB; min-width: 0;',
        dot: 'width: 10px; height: 10px; border-radius: 999px; background: ' + c[2] + ';',
        countStyle: 'min-width: 20px; padding: 1px 7px; border-radius: 999px; font-size: 12px; background: #EEF3FF; color: #2148A8;'
      };
    });
    var canAssign = !!pickedTask && (pickedTask.col === 'waiting' || pickedTask.col === 'doing');
    var people = ['Sam', 'Priya', 'Jo', 'Kim'].map(function (n) {
      return {
        name: n,
        give: function () {
          var sub = pickedTask.sub.replace(/^(Sam|Priya|Jo|Kim) · /, '');
          self.setState({ tasks: upd(pickedTask.id, { col: 'doing', sub: n + ' · ' + sub, pct: pickedTask.pct || 0 }), picked: '', assign: false });
          flash('Ding! ' + n + ' has ' + pickedTask.title.split(' · ')[0]);
        }
      };
    });
    return {
      filters: filters, cols: cols, people: people,
      noPick: !canAssign,
      assignStyle: 'height: 44px; padding: 0 16px; border: 1px solid #CFDAF2; border-radius: 12px; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: ' + (canAssign ? 'pointer' : 'not-allowed') + '; color: ' + (canAssign ? '#18233D' : '#5A6785') + ';',
      assignOn: s.assign && canAssign, pickedTitle: pickedTask ? pickedTask.title : '',
      openAssign: function () { if (canAssign) self.setState({ assign: true, create: false }); },
      closeAssign: function () { self.setState({ assign: false }); },
      createOn: s.create, newWhat: s.newWhat,
      openCreate: function () { self.setState({ create: true, assign: false }); },
      closeCreate: function () { self.setState({ create: false }); },
      setNewType: function (e) { self.setState({ newType: e.target.value }); },
      setNewWhat: function (e) { self.setState({ newWhat: e.target.value }); },
      addTask: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var code = { Count: 'CNT-0', Move: 'MOV-0', Replenish: 'REP-1' }[s.newType] + s.seq;
        var t = { id: 'n' + s.seq, col: 'waiting', type: s.newType, title: s.newType + ' ' + code, sub: s.newWhat || 'Location to be chosen' };
        self.setState({ tasks: [t].concat(s.tasks), create: false, newWhat: '', seq: s.seq + 1 });
        flash('New task ' + code + ' is waiting');
      },
      toastOn: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
