<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple WMS scanner sign-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2557C9}a:hover{color:#1A3F99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 18px; font-family: Manrope, system-ui, sans-serif; color: #18233D; background: #F3F6FD; display: flex; flex-direction: column; gap: 12px;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 28 10 16 17 4 10Z" fill="#6E95F0"/><path d="M4 10 16 17V30L4 23Z" fill="#3E6FE2"/><path d="M28 10 16 17V30L28 23Z" fill="#2B57C2"/></svg>
      <span style="font-size: 17px; font-weight: 800;">Simple WMS</span>
    </div>
    <span style="padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE5F5; font-size: 12px; font-weight: 800; color: #4A5672;">Scanner 3</span>
  </div>

  <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.4px;">Ready to scan?</h1>

  <button type="button" onClick="{{badge}}" style="height: 64px; flex: none; border: 2px dashed #2F6FE4; border-radius: 16px; background: #FFFFFF; color: #18233D; font: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2F6FE4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M7.5 18a4.5 4.5 0 0 1 9 0"/></svg>
    <span style="text-align: left;"><span style="display: block; font-size: 17px; font-weight: 800;">Scan your badge</span><span style="display: block; font-size: 12px; color: #4A5672;">Quickest way in. Tap to pretend-scan.</span></span>
  </button>

  <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #5A6785;"><span style="flex: 1; border-top: 1px solid #CFDAF2;"></span>OR TYPE IT IN<span style="flex: 1; border-top: 1px solid #CFDAF2;"></span></div>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800;">
    Username
    <input type="text" autocomplete="username" autocapitalize="none" value="{{user}}" onInput="{{setUser}}" style="{{userStyle}}">
  </label>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span id="pin-label" style="font-size: 14px; font-weight: 800;">PIN</span>
    <div role="img" aria-labelledby="pin-label" aria-label="{{pinAria}}" style="display: flex; justify-content: center; gap: 18px; padding: 2px 0;">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
        <span style="{{d.style}}"></span>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #FDE2E0; color: #8A1C15; font-size: 14px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: none;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>{{error}}
    </div>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="{{k.style}}">
        <sc-if value="{{k.isBack}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11v12H9l-6-6Z"/><path d="m12 10 4 4M16 10l-4 4"/></svg>
        </sc-if>
        <sc-if value="{{k.isNum}}" hint-placeholder-val="{{ true }}">{{k.label}}</sc-if>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <a href="ScannerHome.dc.html" style="height: 58px; border-radius: 16px; background: #22A35A; color: #FFFFFF; font-weight: 800; font-size: 18px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Start scanning
    </a>
  </sc-if>
  <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{submit}}" style="height: 58px; border: 0; border-radius: 16px; background: #2F6FE4; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 18px; cursor: pointer;">Sign in</button>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; font-size: 12px; color: #5A6785;">
    <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; color: #4A5672;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Signs you out after 8 hours, one shift
    </span>
    <span>5 wrong PINs locks your account. A supervisor can unlock it.</span>
    <a href="ScannerLocked.dc.html" style="font-weight: 700;">See the locked screen</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { user: '', pin: '', error: '', done: false };
  }
  renderVals() {
    var s = this.state, self = this;
    var dots = [0, 1, 2, 3].map(function (i) {
      var filled = i < s.pin.length;
      return { style: 'width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; border: 2px solid ' + (s.error && s.pin.length < 4 ? '#D9443A' : '#2F6FE4') + '; background: ' + (filled ? '#2F6FE4' : 'transparent') + ';' };
    });
    var press = function (v) {
      return function () {
        if (s.done) return;
        if (v === 'back') { self.setState({ pin: s.pin.slice(0, -1), error: '' }); return; }
        if (v === 'clear') { self.setState({ pin: '', error: '' }); return; }
        if (s.pin.length < 4) self.setState({ pin: s.pin + v, error: '' });
      };
    };
    var keyBase = 'height: 52px; border-radius: 16px; font: inherit; font-size: 24px; font-weight: 800; cursor: pointer; display: grid; place-items: center; ';
    var labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'back'];
    var keys = labels.map(function (l) {
      var isNum = l !== 'back' && l !== 'clear';
      return {
        label: l === 'clear' ? 'Clear' : l, isBack: l === 'back', isNum: l !== 'back',
        aria: l === 'back' ? 'Delete last number' : (l === 'clear' ? 'Clear PIN' : l),
        press: press(l),
        style: keyBase + (isNum
          ? 'border: 1px solid #DDE5F5; background: #FFFFFF; color: #18233D;'
          : 'border: 0; background: transparent; color: #4A5672; font-size: 15px;')
      };
    });
    return {
      user: s.user,
      setUser: function (e) { self.setState({ user: e.target.value, error: '' }); },
      userStyle: 'height: 54px; box-sizing: border-box; width: 100%; padding: 0 16px; border-radius: 14px; font: inherit; font-size: 17px; font-weight: 600; color: #18233D; background: #FFFFFF; border: 2px solid ' + (s.error && !s.user ? '#D9443A' : '#CFDAF2') + ';',
      dots: dots, pinAria: s.pin.length + ' of 4 numbers entered',
      keys: keys,
      hasError: !!s.error, error: s.error,
      done: s.done, notDone: !s.done,
      badge: function () { self.setState({ done: true, error: '', user: 'sam.k', pin: '' }); },
      submit: function () {
        if (!s.user) { self.setState({ error: 'Type your username first.' }); return; }
        if (s.pin.length < 4) { self.setState({ error: 'Your PIN needs all 4 numbers.' }); return; }
        self.setState({ done: true, error: '' });
      }
    };
  }
}
</script>
</body>
</html>
