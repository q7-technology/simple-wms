<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple WMS scanner locked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2557C9}a:hover{color:#1A3F99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 24px 22px; font-family: Manrope, system-ui, sans-serif; color: #18233D; background: #F3F6FD; display: flex; flex-direction: column; gap: 18px;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 28 10 16 17 4 10Z" fill="#6E95F0"/><path d="M4 10 16 17V30L4 23Z" fill="#3E6FE2"/><path d="M28 10 16 17V30L28 23Z" fill="#2B57C2"/></svg>
      <span style="font-size: 17px; font-weight: 800;">Simple WMS</span>
    </div>
    <span style="padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE5F5; font-size: 12px; font-weight: 800; color: #4A5672;">Scanner 3</span>
  </div>

  <div style="margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
    <span style="width: 88px; height: 88px; border-radius: 28px; background: #FDE2E0; color: #A3221A; display: grid; place-items: center;">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3M12 15v2"/></svg>
    </span>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.4px;">Account locked</h1>
    <p style="margin: 0; font-size: 15px; color: #4A5672;"><b style="color: #18233D;">sam.k</b> typed the wrong PIN 5 times. A supervisor can unlock it here or on the desktop.</p>
  </div>

  <sc-if value="{{unlocked}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="padding: 16px; border-radius: 18px; background: #E3F5EA; color: #145A31; display: flex; flex-direction: column; gap: 12px; text-align: center;">
      <span style="font-size: 16px; font-weight: 800;">Unlocked by a supervisor</span>
      <span style="font-size: 14px;">Sam picks a new PIN next.</span>
      <a href="ScannerSignIn.dc.html" style="height: 54px; border-radius: 14px; background: #22A35A; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none; display: grid; place-items: center;">Set a new PIN</a>
    </div>
  </sc-if>
  <sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{unlock}}" style="height: 150px; border: 2px dashed #2F6FE4; border-radius: 22px; background: #FFFFFF; color: #18233D; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2F6FE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M7.5 18a4.5 4.5 0 0 1 9 0"/></svg>
      <span style="font-size: 18px; font-weight: 800;">Supervisor: scan your badge</span>
      <span style="font-size: 13px; color: #4A5672;">Tap here to pretend-scan one</span>
    </button>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <a href="ScannerSignIn.dc.html" style="height: 56px; border: 2px solid #18233D; border-radius: 16px; background: #FFFFFF; color: #18233D; font-weight: 800; font-size: 17px; text-decoration: none; display: grid; place-items: center;">Sign in as someone else</a>
    <span style="text-align: center; font-size: 12px; color: #5A6785;">Every try is saved in the history, so managers can see what happened.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unlocked: false };
  }
  renderVals() {
    var self = this;
    return {
      unlocked: this.state.unlocked, locked: !this.state.unlocked,
      unlock: function () { self.setState({ unlocked: true }); }
    };
  }
}
</script>
</body>
</html>
