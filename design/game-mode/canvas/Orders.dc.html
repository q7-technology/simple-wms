<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple WMS orders panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FD}
a{color:#2557C9}a:hover{color:#1A3F99}
@media (max-width: 960px){
.drawer{position:static !important;width:auto !important;border-radius:0 !important}
.dim{display:none !important}
}
</style>
</helmet>
<div style="min-height: 100vh; font-family: Manrope, system-ui, sans-serif; color: #18233D; background: #F3F6FD; position: relative; overflow: hidden;">

  <div class="dim" aria-hidden="true" style="position: absolute; inset: 0;">
    <img src="/_blob/da4428b0458976bb60e501687b333de2" alt="" style="display: block; width: 100%; max-width: 1540px; height: auto; margin: 0 auto; filter: blur(2px);">
    <div style="position: absolute; inset: 0; background: rgba(24,35,61,.38);"></div>
  </div>

  <section class="drawer" aria-label="Orders" style="position: absolute; top: 0; right: 0; bottom: 0; width: 64%; min-width: 0; background: #FFFFFF; border-radius: 24px 0 0 24px; box-shadow: -20px 0 50px rgba(24,35,61,.25); display: flex; flex-direction: column;">

    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 22px 28px 14px;">
      <a href="Main.dc.html" aria-label="Back to the map" style="width: 44px; height: 44px; border-radius: 12px; background: #F3F6FD; color: #18233D; display: grid; place-items: center; text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </a>
      <div style="flex: 1; min-width: 180px;">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.3px;">Orders</h1>
        <div style="font-size: 13px; color: #5A6785;">Tick a few, then boss them around all at once.</div>
      </div>
      <label style="flex: 0 1 300px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid #DDE5F5; border-radius: 12px; background: #F7F9FE; color: #5A6785; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Search orders</span>
        <input type="search" placeholder="Order number or customer" style="flex: 1; border: 0; background: transparent; font: inherit; color: #18233D; outline: none; min-width: 0;">
      </label>
    </header>

    <div role="tablist" aria-label="Order status" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 28px 14px; border-bottom: 1px solid #E6EDFB;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}} <span style="{{t.countStyle}}">{{t.count}}</span></button>
      </sc-for>
    </div>

    <div style="flex: 1; overflow: auto; padding: 8px 28px 120px;">
      <div style="overflow-x: auto;">
        <table style="width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14px;">
          <thead>
            <tr style="text-align: left; color: #5A6785; font-size: 12px; letter-spacing: 1px;">
              <th style="padding: 10px 8px; width: 44px;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Select</span></th>
              <th style="padding: 10px 8px; font-weight: 800;">ORDER</th>
              <th style="padding: 10px 8px; font-weight: 800;">CUSTOMER</th>
              <th style="padding: 10px 8px; font-weight: 800;">PALLETS</th>
              <th style="padding: 10px 8px; font-weight: 800;">WHERE</th>
              <th style="padding: 10px 8px; font-weight: 800;">DUE</th>
              <th style="padding: 10px 8px;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Show on map</span></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
              <tr style="{{r.rowStyle}}">
                <td style="padding: 6px 8px;">
                  <label style="width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer;">
                    <input type="checkbox" checked="{{r.sel}}" onChange="{{r.toggle}}" aria-label="{{r.aria}}" style="width: 20px; height: 20px; accent-color: #2F6FE4; cursor: pointer;">
                  </label>
                </td>
                <td style="padding: 6px 8px; font-weight: 800;"><a href="DeliveryDetail.dc.html" style="color: #2148A8; text-decoration: underline;">{{r.id}}</a></td>
                <td style="padding: 6px 8px;"><div style="font-weight: 700;">{{r.customer}}</div><div style="font-size: 12px; color: #5A6785;">{{r.town}}</div></td>
                <td style="padding: 6px 8px;">{{r.pallets}}</td>
                <td style="padding: 6px 8px;"><span style="{{r.chip}}">{{r.zone}}</span></td>
                <td style="padding: 6px 8px; color: #4A5672;">{{r.due}}</td>
                <td style="padding: 6px 8px; text-align: right;">
                  <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; background: #F3F6FD; color: #2148A8; font-size: 13px; font-weight: 700; text-decoration: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10Z"/><circle cx="12" cy="11" r="2"/></svg>Show on map
                  </a>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 40px 0; text-align: center; color: #5A6785; font-weight: 700;">Nothing here. Nice work!</div>
      </sc-if>
    </div>

    <sc-if value="{{anySel}}" hint-placeholder-val="{{ true }}">
      <div role="region" aria-label="Selected orders" style="position: absolute; left: 28px; right: 28px; bottom: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 10px 10px 18px; border-radius: 16px; background: #18233D; color: #FFFFFF; box-shadow: 0 10px 30px rgba(24,35,61,.3);">
        <span style="font-weight: 800; flex: 1; min-width: 140px;">{{selCount}} selected</span>
        <button type="button" onClick="{{bulkLeave}}" style="height: 44px; padding: 0 14px; border: 1px solid #44507A; border-radius: 12px; background: transparent; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;">Move to Leaving</button>
        <button type="button" style="height: 44px; padding: 0 14px; border: 1px solid #44507A; border-radius: 12px; background: transparent; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;">Print labels</button>
        <button type="button" onClick="{{bulkShip}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #2F6FE4; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer;">Mark as shipped</button>
      </div>
    </sc-if>

    <sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="position: absolute; top: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; background: #18233D; color: #FFFFFF; font-weight: 800; font-size: 14px; box-shadow: 0 10px 30px rgba(24,35,61,.25); white-space: nowrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7CDB9E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>{{toast}}
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'all', toast: '',
      sel: { '2047': true, '2049': true },
      orders: [
        { id: '2047', customer: 'Ridgeline Hardware', town: 'Ballarat', pallets: 3, zone: 'stored', due: 'Today 4:00 pm' },
        { id: '2048', customer: 'Lakeside Cafe Supplies', town: 'Bendigo', pallets: 1, zone: 'leaving', due: 'Today 4:30 pm' },
        { id: '2049', customer: 'Northside Builders', town: 'Geelong', pallets: 5, zone: 'stored', due: 'Today 5:00 pm' },
        { id: '2050', customer: 'Green Valley Garden Co', town: 'Daylesford', pallets: 2, zone: 'arriving', due: 'Tomorrow' },
        { id: '2051', customer: 'Harbour Safety Gear', town: 'Melbourne', pallets: 4, zone: 'stored', due: 'Tomorrow' },
        { id: '2052', customer: 'Sunrise Bakery', town: 'Ararat', pallets: 1, zone: 'arriving', due: 'Wed' },
        { id: '2044', customer: 'Westgate Plumbing', town: 'Melton', pallets: 2, zone: 'shipped', due: 'Shipped 1:12 pm' },
        { id: '2045', customer: 'Oakwood School', town: 'Creswick', pallets: 1, zone: 'shipped', due: 'Shipped 2:40 pm' }
      ]
    };
  }
  renderVals() {
    var s = this.state, self = this;
    var Z = {
      arriving: ['Arriving', '#D8E5FF', '#1F4FB0'],
      stored: ['Stored', '#D3EFE8', '#0F5F59'],
      leaving: ['Leaving', '#FDE6D2', '#8E4A0E'],
      shipped: ['Shipped', '#E6EDFB', '#2148A8']
    };
    var count = function (k) { return s.orders.filter(function (o) { return k === 'all' || o.zone === k; }).length; };
    var tabDefs = [['all', 'All'], ['arriving', 'Arriving'], ['stored', 'Stored'], ['leaving', 'Leaving'], ['shipped', 'Shipped']];
    var tabs = tabDefs.map(function (t) {
      var on = s.tab === t[0];
      return {
        label: t[1], count: count(t[0]), on: on,
        pick: function () { self.setState({ tab: t[0] }); },
        style: 'height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; border: 1px solid ' + (on ? '#2F6FE4' : '#DDE5F5') + '; background: ' + (on ? '#2F6FE4' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#18233D') + ';',
        countStyle: 'min-width: 20px; padding: 1px 6px; border-radius: 999px; font-size: 12px; font-weight: 800; background: ' + (on ? 'rgba(255,255,255,.22)' : '#EEF3FF') + '; color: ' + (on ? '#FFFFFF' : '#2148A8') + ';'
      };
    });
    var flash = function (msg) {
      self.setState({ toast: msg });
      clearTimeout(self._t);
      self._t = setTimeout(function () { self.setState({ toast: '' }); }, 2200);
    };
    var setZone = function (zone) {
      var n = 0;
      var orders = s.orders.map(function (o) {
        if (s.sel[o.id] && o.zone !== 'shipped') { n++; return Object.assign({}, o, { zone: zone, due: zone === 'shipped' ? 'Shipped just now' : o.due }); }
        return o;
      });
      self.setState({ orders: orders, sel: {} });
      return n;
    };
    var rows = s.orders.filter(function (o) { return s.tab === 'all' || o.zone === s.tab; }).map(function (o) {
      var z = Z[o.zone], on = !!s.sel[o.id];
      return {
        id: '#' + o.id, customer: o.customer, town: o.town, pallets: o.pallets, due: o.due, zone: z[0], sel: on,
        aria: 'Select order ' + o.id,
        chip: 'display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: ' + z[1] + '; color: ' + z[2] + ';',
        rowStyle: 'border-top: 1px solid #EEF2FA; background: ' + (on ? '#F2F6FF' : '#FFFFFF') + ';',
        toggle: function () { var n = Object.assign({}, s.sel); n[o.id] = !on; self.setState({ sel: n }); }
      };
    });
    var selCount = Object.keys(s.sel).filter(function (k) { return s.sel[k]; }).length;
    return {
      tabs: tabs, rows: rows, empty: rows.length === 0,
      anySel: selCount > 0, selCount: selCount,
      bulkLeave: function () { var n = setZone('leaving'); flash('Forklifts are moving ' + n + ' order' + (n === 1 ? '' : 's') + ' to Leaving'); },
      bulkShip: function () { var n = setZone('shipped'); flash('Ding! ' + n + ' order' + (n === 1 ? '' : 's') + ' shipped'); },
      toastOn: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
